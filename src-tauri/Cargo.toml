[package]
name = "raw-material-collector"
version = "0.1.0"
description = "Raw Material Collector - a Tauri 2 desktop app for gathering research materials."
edition = "2021"

# The lib crate is explicitly named so that `main.rs` can call
# `raw_material_collector_lib::run()`. This mirrors the official
# Tauri 2 desktop+mobile template layout.
[lib]
name = "raw_material_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

# Aggressive size optimization for release builds.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
